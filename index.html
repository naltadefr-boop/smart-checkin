<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wellness Hôtel – Smart Check-in</title>
<meta name="description" content="Enregistrement des clients et fiches d’hébergement du Wellness Hôtel Bagjem">
<meta name="theme-color" content="#1b4f9c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:Figtree;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Figtree;font-weight:400;font-style:italic;font-display:swap;src:url(fonts/figtree-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:Figtree;font-weight:600;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Figtree;font-weight:700;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Figtree;font-weight:800;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-800-normal.woff2) format('woff2')}
:root{color-scheme:light;
--blue:#1b4f9c;--turq:#16a6a3;--violet:#6a3d9a;
--bg:#ffffff;--soft:#f3f7fc;--card:#ffffff;--ink:#14213d;--mute:#5b6b85;--line:#dbe3ef;
--blueTxt:#1b4f9c;--turqSoft:#e3f6f5;--violetSoft:#f0e9f8;--warn:#b45309;--warnSoft:#fff4e5;--bad:#b42318}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px max(4vw,14px)}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand img{width:44px;height:44px;object-fit:contain}
.brand b{display:block;font-size:15px;color:var(--blueTxt);line-height:1.15}
.brand span{font-size:13px;color:var(--turq);font-weight:600}
.nav{display:flex;gap:4px}
.nav button{border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:600;font-size:15px;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:7px;min-height:44px}
.nav button svg{width:20px;height:20px}
.nav button.on{color:var(--blueTxt);background:var(--soft)}
.who{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
.sync{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}
.sync.ok{background:var(--turq)}
#syncTxt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
main{max-width:1240px;margin:0 auto;padding:22px max(4vw,14px) 110px}
@media(max-width:820px){
 .nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);justify-content:space-around;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:30}
 .nav button{flex-direction:column;gap:2px;font-size:12px;padding:6px 4px;flex:1}
 .who .nm{display:none}
}
.btn{border:0;border-radius:12px;padding:12px 18px;min-height:48px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;text-align:center}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,.room:focus-visible,.it:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
.b1{background:var(--blue);color:#fff}.b2{background:var(--turq);color:#fff}.b3{background:var(--violet);color:#fff}
.bo{background:var(--card);color:var(--blueTxt);border:1.5px solid var(--line)}
.bd{background:none;color:var(--bad);border:1.5px solid var(--line)}
.btn:disabled{opacity:.55;cursor:wait}
.btn svg{width:20px;height:20px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.h{font-size:clamp(26px,4vw,36px);font-weight:800}
.sub{color:var(--mute);margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap}
.chip.in{background:var(--turqSoft);color:#0f7e7b}.chip.v{background:var(--violetSoft);color:var(--violet)}
label.f{display:block}
label.f>span{display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600;color:var(--mute);margin-bottom:5px;flex-wrap:wrap}
input.i,select.i{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--card);font-size:16px}
input.i.auto,select.i.auto{border-color:var(--turq);background:var(--turqSoft)}
input.i.doubt,select.i.doubt{border-color:var(--warn);background:var(--warnSoft)}
.tag{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--turq);color:#fff;font-style:normal}
.tag.w{background:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.sec{margin-top:22px}
.sec>h3{font-size:18px;color:var(--blueTxt);margin-bottom:12px;display:flex;gap:10px;align-items:center}
.sec>h3 i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:14px}
.note{border-radius:12px;padding:12px 14px;background:var(--soft);font-size:14.5px}
.note.t{background:var(--turqSoft)}.note.w{background:var(--warnSoft)}
.prog{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--turq),var(--violet));transition:width .3s}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
.go{background:linear-gradient(135deg,var(--blue),#174287 55%,var(--violet));color:#fff;border-radius:20px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:230px;position:relative;overflow:hidden}
.go h2{font-size:clamp(24px,3.4vw,34px);font-weight:800}
.go p{margin:0;opacity:.92;max-width:42ch}
.go .btn{background:#fff;color:var(--blue);align-self:flex-start;font-size:16px;padding:14px 22px}
.go svg.deco{position:absolute;right:-30px;bottom:-30px;width:220px;height:220px;opacity:.2;pointer-events:none}
.go>*:not(.deco){position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--card)}
.kpi b{display:block;font-size:clamp(28px,4vw,38px);line-height:1.05;font-weight:800;color:var(--blueTxt)}
.kpi span{font-size:14px;color:var(--mute);font-weight:600}
.kpi.t b{color:var(--turq)}.kpi.v b{color:var(--violet)}
.kpi.wide{grid-column:span 2;display:flex;justify-content:space-between;align-items:end;gap:10px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.it:hover{border-color:var(--turq)}
.it .rm{flex:none;width:58px;height:46px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--blueTxt);font-size:14px}
.it .tx{flex:1}.it .tx b{display:block;font-size:15.5px}.it .tx small{color:var(--mute);font-size:13.5px}
.empty{padding:26px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:14px}
.steps{display:flex;gap:6px;margin:16px 0 20px;flex-wrap:wrap}
.steps span{font-size:13.5px;font-weight:700;padding:7px 12px;border-radius:99px;background:var(--soft);color:var(--mute)}
.steps span.on{background:var(--blue);color:#fff}
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.shot{position:relative;border:2px dashed var(--line);border-radius:16px;aspect-ratio:1.58;display:grid;place-items:center;overflow:hidden;cursor:pointer;background:var(--soft);text-align:center}
.shot:hover{border-color:var(--turq)}
.shot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--blueTxt);font-weight:700;padding:10px}
.shot .ph svg{width:36px;height:36px}.shot .ph small{color:var(--mute);font-weight:500}
.shot .ok{position:absolute;left:8px;top:8px;z-index:2}
@media(max-width:420px){.shot .ph small{display:none}}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.sum div{background:var(--soft);border-radius:12px;padding:10px 12px}
.sum small{display:block;color:var(--mute);font-size:12.5px;font-weight:600}
.sum b{font-size:18px;white-space:nowrap}
.pad{position:relative;border:1.5px solid var(--line);border-radius:14px;background:#fff;height:190px;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pad em{position:absolute;left:14px;bottom:10px;color:#9aa9bf;font-size:13px;pointer-events:none}
.bar{padding:14px 0 0;border-top:1px solid var(--line);margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:600px){.bar .btn{flex:1 1 100%}.sum{grid-template-columns:1fr 1fr}}
.fv{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.paper{background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(20,33,61,.12),0 12px 34px rgba(20,33,61,.14);overflow:hidden;aspect-ratio:210/297}
.paper img{width:100%;height:100%;display:block}
.exp{display:flex;flex-direction:column;gap:10px;position:sticky;top:84px}
.exp .btn{width:100%;justify-content:flex-start}
@media(max-width:900px){.fv{grid-template-columns:1fr}.exp{position:static}}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,104px),1fr));gap:10px}
.room{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--card);cursor:pointer;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:3px}
.room b{font-size:18px;color:var(--blueTxt)}.room small{font-size:12.5px;color:var(--mute)}
.room.occ{border-color:var(--violet);background:var(--violetSoft)}.room.occ b{color:var(--violet)}
.room .st{margin-top:auto;font-size:12.5px;font-weight:700;line-height:1.3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin:10px 0 16px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--soft),var(--bg) 60%)}
.lbox{width:min(420px,100%);text-align:center}
.lbox img{width:150px;height:150px;object-fit:contain;margin:0 auto 8px;display:block}
.lbox h1{font-size:28px;font-weight:800;color:var(--blueTxt)}
.lbox p{color:var(--turq);font-weight:700;margin:4px 0 22px}
.lbox form{display:flex;flex-direction:column;gap:12px;text-align:left}
.err{color:var(--bad);font-size:14px;min-height:20px}
.link{background:none;border:0;color:var(--blueTxt);font-weight:600;text-decoration:underline;cursor:pointer;padding:6px 0;align-self:flex-start}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;z-index:60;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(10,18,34,.55);display:grid;place-items:center;z-index:70;padding:18px}
.modal .card{max-width:460px;width:100%}.modal h3{font-size:20px;margin-bottom:8px}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;flex:none}
.spin.dark{border-color:rgba(127,127,127,.35);border-top-color:currentColor}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.prog i{transition:none}}
.search{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;margin:16px 0}
@media(max-width:520px){.search{grid-template-columns:1fr}}
.logoset{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logoset img{width:110px;height:110px;object-fit:contain;border:1px solid var(--line);border-radius:14px;background:#fff;padding:6px}
#printArea{display:none}
@media print{
 @page{size:A4;margin:0}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 #printArea img{width:210mm;height:297mm;display:block}
}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="lbox">
    <img class="logo" alt="Logo Wellness Hôtel Bagjem">
    <h1 class="hname">WELLNESS HÔTEL BAGJEM</h1>
    <p>Smart Check-in · Réception</p>
    <form id="lform" class="card">
      <label class="f"><span>Votre nom (imprimé sur les fiches)</span><input class="i" id="lname" autocomplete="name" placeholder="Nom et prénom du réceptionniste" required></label>
      <label class="f hidden"><span>E-mail du compte</span><input class="i" id="lmail" type="email" autocomplete="username" inputmode="email" placeholder="reception@exemple.com"></label>
      <label class="f hidden"><span>Mot de passe</span><input class="i" id="lpass" type="password" autocomplete="current-password"></label>
      <label class="f"><span>Code d'accès</span><input class="i" id="lpin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••"></label>
      <div class="err" id="lerr" role="alert"></div>
      <button class="btn b1" type="submit" id="lgo">Ouvrir la session</button>
      <button class="link hidden" type="button" id="lforgot">Mot de passe oublié ?</button>
      <small style="color:var(--mute)" id="lhint"></small>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top"><div class="topin">
    <div class="brand"><img class="logo" alt=""><div><b class="hname">WELLNESS HÔTEL BAGJEM</b><span>Smart Check-in</span></div></div>
    <nav class="nav" id="nav">
      <button data-v="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
      <button data-v="nouveau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.5"/><path d="M14 10h4M14 14h4"/></svg>Enregistrer</button>
      <button data-v="historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Historique</button>
      <button data-v="chambres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6M3 18h18M3 14h18M6 10V7h5v3"/></svg>Chambres</button>
      <button data-v="parametres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Paramètres</button>
    </nav>
    <div class="who"><i class="sync" id="sync"></i><span id="syncTxt"></span><span class="nm" id="whoName"></span><button class="btn bo" id="lock" style="min-height:40px;padding:6px 12px;font-size:13px">Verrouiller</button></div>
  </div></header>
  <main id="main"></main>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="card"><h3 id="mt"></h3><p id="mb" style="margin:0 0 16px;color:var(--mute)"></p><div class="row" style="justify-content:flex-end"><button class="btn bo" id="mno">Annuler</button><button class="btn b1" id="mok">Confirmer</button></div></div></div>
<div id="printArea"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
